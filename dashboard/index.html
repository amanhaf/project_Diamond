<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Diamond · Pipeline Control</title>
<style>
  :root {
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f6f9;
    --line:#e6e8ef; --line-2:#d4d9e2;
    --text:#172033; --muted:#5b6473; --faint:#9aa2b1;
    --brand-blue:#203090; --brand-red:#e01020;
    --accent:#203090; --accent-soft:#eef1fb;
    --idle:#9aa3b0; --run:#2742b8; --done:#1f9d57; --err:#d23b3b; --stop:#c4880e;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body { padding:0 0 64px; -webkit-font-smoothing:antialiased; }

  header {
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:15px 26px; background:rgba(255,255,255,.86);
    backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px);
    border-bottom:1px solid var(--line);
  }
  header::before { content:""; position:absolute; left:0; right:0; top:0; height:3px;
    background:linear-gradient(90deg,var(--brand-blue),var(--brand-red)); }

  .brand { display:flex; align-items:center; gap:15px; margin-right:auto; }
  .brand .logo { height:36px; width:auto; display:block; }
  .brand .divider { width:1px; height:30px; background:var(--line-2); }
  .brand .titles { display:flex; flex-direction:column; gap:2px; line-height:1.05; }
  .brand .eyebrow { font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
    text-transform:uppercase; color:var(--brand-blue); font-weight:600; }
  .brand h1 { font-size:17px; font-weight:680; letter-spacing:-.02em; margin:0; color:var(--text); }

  .conn { display:flex; align-items:center; gap:7px; font-family:var(--mono);
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  .conn .dot { width:8px; height:8px; border-radius:50%; background:var(--err);
    box-shadow:0 0 0 3px rgba(210,59,59,.14); transition:.3s; }
  .conn.live .dot { background:var(--done); box-shadow:0 0 0 3px rgba(31,157,87,.16); }

  .controls { display:flex; gap:8px; }
  button {
    font-family:var(--mono); font-size:12px; letter-spacing:.04em;
    color:var(--text); background:#fff; border:1px solid var(--line-2);
    padding:9px 14px; border-radius:9px; cursor:pointer;
    transition:.14s border-color,.14s background,.14s box-shadow;
  }
  button:hover { border-color:#b9c0cb; background:#fafbfc; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.primary { color:#fff; background:var(--accent); border-color:var(--accent); }
  button.primary:hover { background:#1a2778; border-color:#1a2778;
    box-shadow:0 3px 12px rgba(32,48,144,.22); }
  button:focus-visible { outline:2px solid var(--run); outline-offset:2px; }

  main { max-width:1140px; margin:0 auto; padding:26px;
    display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
  @media (max-width:760px){ main { grid-template-columns:1fr; padding:16px; } }
  /* If one card is alone on the last row (odd count, e.g. the 3rd Web locator
     card), span both columns but keep one-column width and center it. */
  @media (min-width:761px){
    main > .card:last-child:nth-child(odd){
      grid-column:1 / -1; justify-self:center; width:calc((100% - 18px) / 2);
    }
  }

  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:20px; display:flex; flex-direction:column; gap:14px; min-width:0;
    box-shadow:0 1px 2px rgba(20,30,55,.04),0 4px 16px rgba(20,30,55,.05);
    transition:box-shadow .18s,transform .18s,border-color .18s; }
  .card:hover { border-color:#dde1ea; transform:translateY(-1px);
    box-shadow:0 2px 6px rgba(20,30,55,.07),0 12px 28px rgba(20,30,55,.09); }
  .card .top { display:flex; align-items:flex-start; gap:10px; }
  .id { font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--faint); }
  .title { font-size:16.5px; font-weight:650; letter-spacing:-.01em; margin:3px 0 0; color:var(--text); }
  .desc { font-size:13px; color:var(--muted); line-height:1.5; margin:0; }

  .pill { margin-left:auto; flex:none; display:inline-flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    padding:4px 10px; border-radius:999px; border:1px solid var(--line-2); color:var(--muted); background:#fff; }
  .pill .led { width:7px; height:7px; border-radius:50%; background:var(--idle); }
  .pill[data-s=running]{ color:#23409e; border-color:#c3ccef; background:var(--accent-soft); }
  .pill[data-s=running] .led{ background:var(--run); animation:pulse 1.1s ease-in-out infinite; }
  .pill[data-s=done]{ color:#137a41; border-color:#bfe6cd; background:#eef9f1; }
  .pill[data-s=done] .led{ background:var(--done); }
  .pill[data-s=error]{ color:#b32626; border-color:#f0c6c6; background:#fdeeee; }
  .pill[data-s=error] .led{ background:var(--err); }
  .pill[data-s=stopped]{ color:#8a6200; border-color:#ecd9a6; background:#fdf6e6; }
  .pill[data-s=stopped] .led{ background:var(--stop); }
  @keyframes pulse { 0%,100%{ opacity:.35; } 50%{ opacity:1; } }

  .meta { display:flex; justify-content:space-between; font-family:var(--mono);
    font-size:11.5px; color:var(--faint); }
  .meta .count { color:var(--muted); }

  /* progress — the signature: a stitched thread line */
  .bar { height:7px; border-radius:7px; background:var(--surface-2);
    border:1px solid var(--line); overflow:hidden; position:relative; }
  .bar .fill { position:absolute; inset:0; width:0%; border-radius:7px;
    background:linear-gradient(90deg,#2742b8,#5570e0); transition:width .35s ease; }
  .bar.indeterminate .fill { width:100%;
    background-image:repeating-linear-gradient(90deg,var(--run) 0 7px,transparent 7px 16px);
    background-size:32px 100%; animation:stitch 0.9s linear infinite; opacity:.9; }
  .bar.idle .fill { background:var(--line-2); width:0%; }
  @keyframes stitch { from{ background-position:0 0; } to{ background-position:32px 0; } }

  .row { display:flex; gap:8px; align-items:center; }
  input[type=text] {
    flex:1; min-width:0; font-family:var(--mono); font-size:12px;
    color:var(--text); background:var(--surface-2); border:1px solid var(--line-2);
    padding:9px 11px; border-radius:9px; }
  input[type=text]:focus { outline:none; border-color:var(--run); box-shadow:0 0 0 3px rgba(39,66,184,.12); }
  input[type=text]::placeholder { color:var(--faint); }

  details.logwrap { border-top:1px solid var(--line); padding-top:12px; }
  details.logwrap > summary { font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); cursor:pointer; list-style:none; }
  details.logwrap > summary::-webkit-details-marker { display:none; }
  details.logwrap > summary::before { content:"\25B8 "; color:var(--faint); }
  details.logwrap[open] > summary::before { content:"\25BE "; }
  pre.log { margin:10px 0 0; max-height:220px; overflow:auto; padding:12px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    font-family:var(--mono); font-size:11.5px; line-height:1.55; color:#3a4350;
    white-space:pre-wrap; word-break:break-word; }
  pre.log .empty { color:var(--faint); }
  pre.log .cmd { color:var(--brand-blue); }

  @media (prefers-reduced-motion: reduce) {
    .pill .led, .bar.indeterminate .fill { animation:none !important; }
    .card:hover { transform:none; }
  }
</style>
</head>

      <span class="divider"></span>
      <div class="titles">
        <span class="eyebrow">Project Diamond</span>
        <h1>Pipeline Control</h1>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="startAll">Start all idle</button>
      <button id="stopAll">Stop all running</button>
      <button id="viewResults">View results &rarr;</button>
    </div>
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">connecting</span></div>
  </header>

  <main id="grid"></main>

<script>
(() => {
  const grid = document.getElementById("grid");
  const conn = document.getElementById("conn");
  const connText = document.getElementById("connText");
  const cards = {};          // id -> { el, refs, spec, status }
  const MAX_LOG_LINES = 300;

  const fmtElapsed = (start, end) => {
    if (!start) return "—";
    const s = Math.max(0, Math.round(((end || Date.now()/1000) - start)));
    const m = Math.floor(s/60), r = s%60;
    return m ? `${m}m ${r}s` : `${r}s`;
  };

  function buildCard(p) {
    const el = document.createElement("section");
    el.className = "card";
    el.innerHTML = `
      <div class="top">
        <div>
          <div class="id">${p.id}</div>
          <h2 class="title">${p.label}</h2>
        </div>
        <span class="pill" data-s="idle"><span class="led"></span><span class="lbl">idle</span></span>
      </div>
      <p class="desc">${p.desc || ""}</p>
      <div class="meta"><span class="count">—</span><span class="elapsed">—</span></div>
      <div class="bar idle"><div class="fill"></div></div>
      ${p.arg_label ? `<div class="row"><input type="text" class="arg" placeholder="${p.arg_label}"></div>` : ""}
      <div class="row">
        <button class="primary btn-start">Start</button>
        <button class="btn-stop" disabled>Stop</button>
      </div>
      <details class="logwrap"><summary>Log</summary>
        <pre class="log"><span class="empty">No output yet.</span></pre>
      </details>`;
    grid.appendChild(el);

    const refs = {
      pill: el.querySelector(".pill"),
      pillLbl: el.querySelector(".pill .lbl"),
      count: el.querySelector(".count"),
      elapsed: el.querySelector(".elapsed"),
      bar: el.querySelector(".bar"),
      fill: el.querySelector(".fill"),
      arg: el.querySelector(".arg"),
      start: el.querySelector(".btn-start"),
      stop: el.querySelector(".btn-stop"),
      log: el.querySelector(".log"),
    };
    refs.start.addEventListener("click", () => post(p.id, "start", refs.arg ? refs.arg.value.trim() : null));
    refs.stop.addEventListener("click", () => post(p.id, "stop"));
    cards[p.id] = { el, refs, spec:p, status:"idle", started_at:null, ended_at:null };
  }

  function setProgress(c, status, done, total) {
    const { bar, fill } = c.refs;
    bar.classList.remove("idle","indeterminate");
    if (status === "running" && (!total || total <= 0)) {
      bar.classList.add("indeterminate"); fill.style.width = "100%";
    } else if (total && total > 0) {
      fill.style.width = Math.min(100, (done/total)*100) + "%";
    } else if (status === "done") {
      fill.style.width = "100%";
    } else {
      bar.classList.add("idle"); fill.style.width = "0%";
    }
  }

  function applyState(c, st) {
    c.status = st.status; c.started_at = st.started_at; c.ended_at = st.ended_at;
    c.refs.pill.dataset.s = st.status;
    c.refs.pillLbl.textContent = st.status;
    const t = st.total, d = st.done || 0;
    c.refs.count.textContent =
      (t && t > 0) ? `${d} / ${t}` :
      (d > 0 ? `${d} processed` :
      (st.long_running && st.status === "running" ? "service up" : "—"));
    c.refs.elapsed.textContent = fmtElapsed(st.started_at, st.ended_at);
    setProgress(c, st.status, d, t);
    const running = st.status === "running";
    c.refs.start.disabled = running;
    c.refs.stop.disabled = !running;
  }

  function renderLog(c, lines) {
    const pre = c.refs.log;
    if (!lines || !lines.length) { pre.innerHTML = '<span class="empty">No output yet.</span>'; return; }
    pre.textContent = "";
    for (const ln of lines.slice(-MAX_LOG_LINES)) appendLine(c, ln, false);
    pre.scrollTop = pre.scrollHeight;
  }

  function appendLine(c, line, autoscroll = true) {
    const pre = c.refs.log;
    const empty = pre.querySelector(".empty");
    if (empty) pre.textContent = "";
    const near = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    const span = document.createElement("span");
    if (line.startsWith("$ ")) span.className = "cmd";
    span.textContent = line + "\n";
    pre.appendChild(span);
    while (pre.childNodes.length > MAX_LOG_LINES) pre.removeChild(pre.firstChild);
    if (autoscroll && near) pre.scrollTop = pre.scrollHeight;
  }

  async function post(id, action, arg) {
    try {
      await fetch(`/api/pipelines/${id}/${action}`, {
        method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(arg ? { arg } : {}),
      });
    } catch (e) { /* surfaced via log/status stream */ }
  }

  document.getElementById("startAll").addEventListener("click", () => {
    for (const id in cards) if (cards[id].status !== "running") {
      const a = cards[id].refs.arg;
      if (a && !a.value.trim()) continue;   // skip pipelines awaiting required input
      post(id, "start", a ? a.value.trim() : null);
    }
  });
  document.getElementById("stopAll").addEventListener("click", () => {
    for (const id in cards) if (cards[id].status === "running") post(id, "stop");
  });
  document.getElementById("viewResults").addEventListener("click", () => window.open("/results/", "_blank"));

  // live elapsed ticker for running jobs
  setInterval(() => {
    for (const id in cards) {
      const c = cards[id];
      if (c.status === "running") c.refs.elapsed.textContent = fmtElapsed(c.started_at, null);
    }
  }, 1000);

  // ---- WebSocket ----
  let ws, retry = 0;
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { retry = 0; conn.classList.add("live"); connText.textContent = "live"; };
    ws.onclose = () => {
      conn.classList.remove("live"); connText.textContent = "reconnecting";
      retry = Math.min(retry + 1, 6); setTimeout(connect, 400 * retry);
    };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === "snapshot") {
        grid.innerHTML = ""; for (const k in cards) delete cards[k];
        for (const p of m.pipelines) { buildCard(p); applyState(cards[p.id], p); renderLog(cards[p.id], p.log); }
      } else if (m.type === "status") {
        const c = cards[m.pipeline.id]; if (c) applyState(c, m.pipeline);
      } else if (m.type === "log") {
        const c = cards[m.id];
        if (c) { appendLine(c, m.line); if (m.total !== undefined) {
          c.refs.count.textContent = (m.total && m.total>0) ? `${m.done} / ${m.total}` : `${m.done} processed`;
          setProgress(c, "running", m.done, m.total);
        } }
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
